# Testes: rodam a cada push na main e antes de cada Release (o Release não sai se falharem).
name: Testes
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sintaxe do Python e dos scripts
        run: |
          python -m compileall -q arasaka_techie
          for f in *.sh server/*.sh; do bash -n "$f"; done
      - name: Abre o app sem tela e tira um print
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 >/dev/null
          pip install -q "PySide6-Essentials>=6.5"
          mkdir -p "$RUNNER_TEMP/home"
          QT_QPA_PLATFORM=offscreen HOME="$RUNNER_TEMP/home" timeout 120 python -m arasaka_techie --screenshot="$RUNNER_TEMP/tela.png"
          test -s "$RUNNER_TEMP/tela.png"
      - name: Compatibilidade, estimativa, airflow, upgrade e escolha passo a passo
        run: timeout 60 python tests/test_simulador.py
      - name: Leitura do PC e sugestoes de upgrade
        run: timeout 60 python tests/test_upgrade_pc.py
      - name: Precos no app (historico, veredito, cache)
        run: timeout 60 python tests/test_precos.py
      - name: Coletor de precos (PHP)
        run: |
          for f in server/techie/*.php; do php -l "$f"; done
          php tests/test_coletor.php
      - uses: actions/upload-artifact@v4
        with:
          name: tela
          path: ${{ runner.temp }}/tela.png
      - name: Visual igual ao ArasakaKit
        run: |
          for f in fx.py kit.py; do
            curl -fsSL "https://raw.githubusercontent.com/Ruiso-Outside/ArasakaKit/main/arasaka_kit/$f" -o "$RUNNER_TEMP/$f" || { echo "::warning::não consegui baixar $f do ArasakaKit"; continue; }
            cmp -s "$RUNNER_TEMP/$f" "arasaka_techie/$f" || echo "::warning::arasaka_techie/$f está diferente do ArasakaKit: rode ArasakaKit/sync.sh"
          done
  windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8   # o console do Windows (cp1252) nao imprime o ■ dos testes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sintaxe e instalador do Windows
        shell: pwsh
        run: |
          python -m compileall -q arasaka_techie
          foreach ($f in 'install.ps1', 'uninstall.ps1') { $t = $null; $e = $null; $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$t, [ref]$e); if ($e) { throw "${f}: $e" } }
      - name: Abre o app sem tela no Windows e tira um print
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          ARASAKA_BLACKWALL_DEMO: '1'
        run: |
          pip install -q "PySide6-Essentials>=6.5"
          python -m arasaka_techie --screenshot="$env:RUNNER_TEMP\tela-windows.png"
          if (-not (Test-Path "$env:RUNNER_TEMP\tela-windows.png")) { throw 'sem print' }
      - name: test_precos.py no Windows
        shell: pwsh
        run: python tests/test_precos.py
      - name: test_simulador.py no Windows
        shell: pwsh
        run: python tests/test_simulador.py
      - name: test_upgrade_pc.py no Windows
        shell: pwsh
        run: python tests/test_upgrade_pc.py
      - uses: actions/upload-artifact@v4
        with:
          name: tela-windows
          path: ${{ runner.temp }}/tela-windows.png
